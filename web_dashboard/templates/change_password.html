<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Capitec CDRS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-section">
                    <i class="fas fa-chart-line"></i>
                    <h1>Capitec CDRS</h1>
                    <p class="subtitle">Daily Reconciliation System</p>
                </div>
            </div>

            <div class="auth-section active">
                <div class="auth-form">
                    <div class="form-header">
                        <h3><i class="fas fa-key"></i> Change Password</h3>
                        <p>Update your account password</p>
                    </div>
                    
                    <div id="changePasswordError" class="alert alert-danger d-none" role="alert">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="changePasswordErrorText"></span>
                    </div>
                    
                    <div id="changePasswordSuccess" class="alert alert-success d-none" role="alert">
                        <i class="fas fa-check-circle"></i>
                        <span id="changePasswordSuccessText"></span>
                    </div>
                    
                    <form id="changePasswordForm">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">
                                <i class="fas fa-lock"></i> Current Password
                            </label>
                            <input type="password" class="form-control" id="currentPassword" required autocomplete="current-password">
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">
                                <i class="fas fa-lock"></i> New Password
                            </label>
                            <input type="password" class="form-control" id="newPassword" required autocomplete="new-password">
                            <div class="form-text">
                                <i class="fas fa-info-circle"></i> Minimum 8 characters, 1 uppercase letter, 1 number
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmNewPassword" class="form-label">
                                <i class="fas fa-lock"></i> Confirm New Password
                            </label>
                            <input type="password" class="form-control" id="confirmNewPassword" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-auth w-100" id="changePasswordBtn">
                            <i class="fas fa-save"></i> Update Password
                        </button>
                    </form>
                    
                    <div class="auth-footer">
                        <a href="/" class="btn btn-link">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>

            <div class="auth-footer-bottom">
                <p class="text-muted small">
                    <i class="fas fa-shield-alt"></i> Secure Access Only
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='auth.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('changePasswordForm');
            if (form) {
                form.addEventListener('submit', handleChangePassword);
            }
        });

        async function handleChangePassword(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            const errorDiv = document.getElementById('changePasswordError');
            const errorText = document.getElementById('changePasswordErrorText');
            const successDiv = document.getElementById('changePasswordSuccess');
            const successText = document.getElementById('changePasswordSuccessText');
            const submitBtn = document.getElementById('changePasswordBtn');
            
            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');
            
            if (!currentPassword || !newPassword || !confirmPassword) {
                showError(errorDiv, errorText, 'Please fill in all fields');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError(errorDiv, errorText, 'New passwords do not match');
                return;
            }

            if (newPassword.length < 8) {
                showError(errorDiv, errorText, 'Password must be at least 8 characters');
                return;
            }

            if (!/[A-Z]/.test(newPassword)) {
                showError(errorDiv, errorText, 'Password must contain at least one uppercase letter');
                return;
            }

            if (!/[0-9]/.test(newPassword)) {
                showError(errorDiv, errorText, 'Password must contain at least one number');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

            try {
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        current_password: currentPassword, 
                        new_password: newPassword 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    successText.textContent = 'Password updated successfully! Redirecting...';
                    successDiv.classList.remove('d-none');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    showError(errorDiv, errorText, data.error || 'Failed to update password');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-save"></i> Update Password';
                }
            } catch (error) {
                showError(errorDiv, errorText, 'Network error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save"></i> Update Password';
            }
        }
    </script>
</body>
</html>
